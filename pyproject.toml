[project]
name = "hexlauncher"
version = "0.7.0-beta.1"
description = "HexLauncher - minimalist, dependency-light Minecraft launcher with mod loader support."
requires-python = ">=3.11"
dependencies = [
    "customtkinter==5.2.2",
    "darkdetect==0.8.0",
    "minecraft-launcher-lib==8.0",
    "requests==2.34.2",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "types-requests>=2.32",
    "pyinstaller==6.22.3",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
